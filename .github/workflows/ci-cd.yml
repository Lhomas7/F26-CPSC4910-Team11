name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:            # manual run — also how you redeploy/roll back, see Rollback in the instructions doc
    inputs:
      ref:
        description: 'Commit SHA or branch to (re)deploy. Leave blank to deploy latest main.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DB_ENGINE: sqlite            # tests need no MySQL; matches the README test flow
  TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY_TEST }}  # valid Fernet key; required at import

jobs:
  backend:
    name: Backend (Django 6.1 / CPython 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System deps for mysqlclient wheel build
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: No missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: Test suite
        working-directory: backend
        run: python manage.py test
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: Deployment checks (fail-loud security review)
        working-directory: backend
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-not-a-real-key
          DJANGO_ALLOWED_HOSTS: test.invalid

  frontend:
    name: Frontend (React 19 / Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile-exact)
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --runInBand

      - name: Production build
        working-directory: frontend
        run: REACT_APP_API_URL=/api npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (docker compose on EC2)
    needs: [backend, frontend, secrets]
    if: github.event_name != 'pull_request'   # never deploy from a PR — only main pushes / manual runs
    runs-on: ubuntu-latest
    environment: production   # scopes secrets/vars only — no required reviewer, so this runs unattended
    concurrency:
      group: deploy-prod
      cancel-in-progress: false     # never cancel a deploy mid-flight, even if another push lands on main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}   # lets workflow_dispatch redeploy an older commit

      - name: Fetch built frontend
        uses: actions/download-artifact@v4
        with: { name: frontend-build, path: frontend/build }

      # Path B: no AWS Secrets Manager (this AWS account can't create IAM
      # roles). Real values come straight from GitHub environment secrets and
      # get written into web/.env here. Note the heredoc marker is unquoted
      # (EOF, not 'EOF') so GitHub Actions substitutes the ${{ }} expressions
      # before the shell ever sees them.
      - name: Write runtime env (.env, chmod 600)
        run: |
          umask 177
          cat > web/.env <<EOF
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=${{ vars.EC2_HOST }}
          DJANGO_BEHIND_PROXY=true
          DJANGO_SECURE_SSL_REDIRECT=true
          DB_ENGINE=mysql
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          TOTP_ENCRYPTION_KEY=${{ secrets.TOTP_ENCRYPTION_KEY }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          PASSWORD_RESET_TIMEOUT_SECONDS=3600
          PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS=60
          DEFAULT_FROM_EMAIL=${{ vars.DEFAULT_FROM_EMAIL }}
          # EMAIL_* / TWILIO_* are intentionally omitted for now — until SES/Twilio
          # are set up, production falls back to Django's console backend for both.
          # Add them here (and as GitHub secrets) once those are ready.
          EOF
          chmod 600 web/.env

      - name: Ship code and env to server
        env:
          HOST: ${{ vars.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/.env' \
            --exclude 'backend/db.sqlite3' \
            --exclude 'backend/media' \
            ./ deploy@${HOST}:/opt/gooddriver/src/

      - name: Build and start containers (waits for health)
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${HOST} '
            set -e
            cd /opt/gooddriver/src
            # keep the outgoing image as a one-step-back fallback (see Rollback)
            docker image inspect gooddriver-web:latest >/dev/null 2>&1 && \
              docker tag gooddriver-web:latest gooddriver-web:previous || true
            docker compose build --pull
            docker compose up -d
            # mount the new SPA bundle and reload Caddy without bouncing the API:
            docker compose up -d webproxy
          '

      - name: Smoke test API
        run: |
          curl -fsS --retry 12 --retry-delay 5 "${{ vars.HEALTH_URL }}/api/health/"

      - name: Smoke test SPA
        run: |
          curl -fsS --retry 6 --retry-delay 5 -o /dev/null "${{ vars.HEALTH_URL }}/"
