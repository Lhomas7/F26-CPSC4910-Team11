name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:            # manual run — also how you redeploy/roll back, see Rollback in the instructions doc
    inputs:
      ref:
        description: 'Commit SHA or branch to (re)deploy. Leave blank to deploy latest main.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DB_ENGINE: sqlite            # default; the isolated MySQL job overrides this
  TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY_TEST }}  # valid Fernet key; required at import

jobs:
  backend:
    name: Backend (Django 6.1 / CPython 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System deps for mysqlclient wheel build
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Local development launcher tests
        run: python -m unittest discover -s tests

      - name: Django system checks
        working-directory: backend
        run: python manage.py check
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: No missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: Fresh SQLite migration and applied-state check
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: Test suite
        working-directory: backend
        run: python manage.py test
        env: { DJANGO_SECRET_KEY: ci-not-a-real-key }

      - name: Deployment checks (fail-loud security review)
        working-directory: backend
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-not-a-real-key
          DJANGO_ALLOWED_HOSTS: test.invalid

  backend-mysql:
    name: Backend compatibility (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI-only credentials; never use these on RDS or another server.
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: gdip_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_ENGINE: mysql
      DB_NAME: gdip_ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-disposable-only
      DJANGO_SECRET_KEY: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Check and migrate the disposable MySQL schema
        working-directory: backend
        run: |
          python manage.py check --database default
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Focused MySQL compatibility tests
        working-directory: backend
        run: >-
          python manage.py test
          accounts.tests.test_database_compatibility
          accounts.tests.test_data_at_rest.EncryptedPhoneNumberTests
          accounts.tests.test_view_as_eligibility
          accounts.tests.test_impersonation_lifecycle
          accounts.tests.test_admin_users.AdminUserCreationTests
          drivers.tests.PointAdjustmentAPITests
          drivers.tests.DriverLinkTests
          drivers.tests.SponsorOnlyActionTests
          --noinput

  frontend:
    name: Frontend (React 19 / Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile-exact)
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --runInBand

      - name: Production build
        working-directory: frontend
        run: REACT_APP_API_URL=/api npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (docker compose on EC2)
    needs: [backend, backend-mysql, frontend, secrets]
    if: github.event_name != 'pull_request'   # never deploy from a PR — only main pushes / manual runs
    runs-on: ubuntu-latest
    environment: production   # scopes secrets/vars only — no required reviewer, so this runs unattended
    concurrency:
      group: deploy-prod
      cancel-in-progress: false     # never cancel a deploy mid-flight, even if another push lands on main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}   # lets workflow_dispatch redeploy an older commit

      - name: Fetch built frontend
        uses: actions/download-artifact@v4
        with: { name: frontend-build, path: frontend/build }

      # Path B: no AWS Secrets Manager (this AWS account can't create IAM
      # roles). Real values come straight from GitHub environment secrets and
      # get written into web/.env here. Note the heredoc marker is unquoted
      # (EOF, not 'EOF') so GitHub Actions substitutes the ${{ }} expressions
      # before the shell ever sees them.
      # docker-compose.yml reads SITE_DOMAIN from the HOST SHELL environment
      # at `docker compose up` time (via ${SITE_DOMAIN:-http://localhost}) —
      # not from web/.env, which only the `web` service sees. Without this,
      # it silently defaults to "http://localhost", so Caddy only routes
      # requests whose Host header is literally "localhost" — every real
      # request (browser or smoke test) falls through to Caddy's unmatched-
      # site fallback: a bare 200 with no body. That produced a blank page
      # that looked like a passing deploy, since a bare 200 still satisfies
      # a status-code-only smoke test. A root-level .env (next to
      # docker-compose.yml) is what docker compose auto-loads for variable
      # substitution, so writing it here is what actually fixes this.
      # vars.SITE_DOMAIN must be a bare hostname (no http:// prefix): that is
      # what turns on Caddy's automatic Let's Encrypt cert + HTTP->HTTPS
      # redirect. Requires inbound TCP 80 and 443 open on the EC2 security
      # group; certs persist in the caddy_data volume across deploys.
      - name: Write compose-level env (.env for docker compose variable substitution)
        run: |
          echo "SITE_DOMAIN=${{ vars.SITE_DOMAIN }}" > .env

      - name: Write runtime env (.env, chmod 600)
        run: |
          # mkdir before umask: web/ isn't tracked in git, so under umask 177
          # it would be created 0600 (no x bit) and the write below would fail.
          mkdir -p web
          umask 177
          cat > web/.env <<EOF
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=${{ vars.EC2_HOST }},${{ vars.APP_DOMAIN }},127.0.0.1
          # 127.0.0.1 is required: the Docker HEALTHCHECK hits the app from
          # inside the container at http://127.0.0.1:8000, which Django
          # rejects as a disallowed host without this.
          DJANGO_BEHIND_PROXY=true
          # Caddy terminates TLS for vars.SITE_DOMAIN (auto Let's Encrypt cert)
          # and forwards X-Forwarded-Proto, which DJANGO_BEHIND_PROXY trusts.
          # Secure cookies also make the CSRF cookie Secure (settings.py
          # mirrors it). /api/health/ stays exempt from the redirect so the
          # container HEALTHCHECK can still probe over plain HTTP.
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SESSION_COOKIE_SECURE=true
          DJANGO_CSRF_TRUSTED_ORIGINS=https://${{ vars.APP_DOMAIN }}
          DB_ENGINE=mysql
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          TOTP_ENCRYPTION_KEY=${{ secrets.TOTP_ENCRYPTION_KEY }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          PASSWORD_RESET_TIMEOUT_SECONDS=3600
          PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS=60
          DEFAULT_FROM_EMAIL=${{ vars.DEFAULT_FROM_EMAIL }}
          # EMAIL_* / TWILIO_* are intentionally omitted for now — until SES/Twilio
          # are set up, production falls back to Django's console backend for both.
          # Add them here (and as GitHub secrets) once those are ready.
          EOF
          chmod 600 web/.env

      - name: Ship code and env to server
        env:
          HOST: ${{ vars.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/.env' \
            --exclude 'backend/db.sqlite3' \
            --exclude 'backend/media' \
            ./ deploy@${HOST}:/opt/gooddriver/src/

      # docker compose up -d does NOT reliably reload webproxy below:
      # docker/Caddyfile is bind-mounted, and Compose only recreates a
      # container when something in docker-compose.yml's declared config
      # changes (image, env, mount paths) - it has no visibility into the
      # CONTENT of a bind-mounted file. A Caddyfile edit with no other
      # webproxy-relevant change can silently leave the old Caddy process
      # running with its old, already-loaded config. A plain restart always
      # re-reads the file on process start, regardless of what Compose
      # thinks changed - that is why the step below uses restart, not up -d.
      - name: Build and start containers (waits for health)
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${HOST} '
            set -e
            cd /opt/gooddriver/src
            # keep the outgoing image as a one-step-back fallback (see Rollback)
            docker image inspect gooddriver-web:latest >/dev/null 2>&1 && \
              docker tag gooddriver-web:latest gooddriver-web:previous || true
            docker compose build --pull
            docker compose up -d
            docker compose restart webproxy
          '

      - name: Smoke test API
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "${{ vars.HEALTH_URL }}/api/health/"

      - name: Smoke test SPA
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-connrefused -o index.html "${{ vars.HEALTH_URL }}/"
          # Status 200 alone isn't enough: Caddy returns a bare 200 with an
          # EMPTY body for a request whose Host header doesn't match any
          # configured site (e.g. SITE_DOMAIN misconfigured/unset on the
          # server) — a real bug that shipped a blank page while every
          # status-code-only check, including earlier versions of this exact
          # smoke test, kept reporting green. Require real content.
          size=$(wc -c < index.html)
          test "$size" -gt 200 || { echo "::error::index.html suspiciously small/empty ($size bytes) — check SITE_DOMAIN / Caddy Host routing"; exit 1; }
          # Fetching / alone isn't enough either — it returns 200 even when the
          # SPA's JS/CSS 404 behind it (a Caddy /static/* misroute previously
          # sent the bundle's own JS to Django, which 404'd since it only
          # exists in the mounted build, not Django's STATIC_ROOT — shipped a
          # blank page while this check would have caught it). Fetch the real
          # hashed asset referenced in index.html too, and confirm real size.
          asset=$(grep -oE '/static/js/main\.[a-zA-Z0-9]+\.js' index.html | head -1)
          test -n "$asset" || { echo "::error::No SPA JS bundle referenced in index.html"; exit 1; }
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused -o main.js "${{ vars.HEALTH_URL }}${asset}"
          jssize=$(wc -c < main.js)
          test "$jssize" -gt 1000 || { echo "::error::SPA JS bundle suspiciously small/empty ($jssize bytes)"; exit 1; }
