  deploy:
    name: Deploy (docker compose on EC2)
    needs: [backend, frontend, secrets]
    if: github.event_name != 'pull_request'   # never deploy from a PR — only main pushes / manual runs
    runs-on: ubuntu-latest
    environment: production   # scopes secrets/vars only — no required reviewer, so this runs unattended
    concurrency:
      group: deploy-prod
      cancel-in-progress: false     # never cancel a deploy mid-flight, even if another push lands on main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}   # lets workflow_dispatch redeploy an older commit

      - name: Fetch built frontend
        uses: actions/download-artifact@v4
        with: { name: frontend-build, path: frontend/build }

      # docker-compose.yml's webproxy service reads SITE_DOMAIN from the HOST
      # SHELL environment at `docker compose up` time (`${SITE_DOMAIN:-http://
      # localhost}`) — not from web/.env, which only the `web` service sees.
      # Left unset, it silently defaults to "http://localhost", so Caddy only
      # actively routes requests whose Host header is literally "localhost".
      # Every real request — a browser hitting the EC2 IP/domain, or the
      # smoke tests below — then falls through to Caddy's unmatched-site
      # fallback: a bare 200 with an empty body. That's a blank page that
      # still returns 200, so a status-code-only smoke test won't catch it
      # (see the byte-size checks added to the smoke tests below). A
      # root-level .env, next to docker-compose.yml, is what docker compose
      # auto-loads for this substitution — writing it here is the fix.
      - name: Write compose-level env (.env for docker compose variable substitution)
        run: |
          echo "SITE_DOMAIN=${{ vars.SITE_DOMAIN }}" > .env

      - name: Write runtime env (.env, chmod 600)
        run: |
          umask 177
          cat > web/.env <<'EOF'
          # Non-secret config only; app secrets are read from AWS Secrets Manager at startup.
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=${{ vars.EC2_HOST }}
          DJANGO_BEHIND_PROXY=true
          DJANGO_SECURE_SSL_REDIRECT=true
          # DB_ENGINE is not an allowed Secrets Manager key, so it must be in the env.
          DB_ENGINE=mysql
          # Non-secret email switches; credentials come from the AWS secret.
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_USE_TLS=true
          DEFAULT_FROM_EMAIL=${{ vars.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          PASSWORD_RESET_TIMEOUT_SECONDS=3600
          PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS=60
          AWS_SECRETS_MANAGER_SECRET_ID=${{ vars.AWS_SECRETS_MANAGER_SECRET_ID }}
          AWS_REGION=${{ vars.AWS_REGION }}
          EOF

      - name: Ship code and env to server (apply new hash)
        env:
          HOST: ${{ vars.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/.env' \
            --exclude 'backend/db.sqlite3' \
            --exclude 'backend/media' \
            ./ deploy@${HOST}:/opt/gooddriver/src/

      - name: Build and start containers (waits for health)
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${HOST} '
            set -e
            cd /opt/gooddriver/src
            # keep the outgoing image as a one-step-back fallback (see Rollback)
            docker image inspect gooddriver-web:latest >/dev/null 2>&1 && \
              docker tag gooddriver-web:latest gooddriver-web:previous || true
            docker compose build --pull
            docker compose up -d
            # mount the new SPA bundle and reload Caddy without bouncing the API:
            docker compose up -d webproxy
          '

      - name: Smoke test API
        run: |
          curl -fsS --retry 12 --retry-delay 5 \
            "${{ vars.HEALTH_URL }}/api/health/"          # e.g. https://gooddriver.example/api/health/

      - name: Smoke test SPA
        run: |
          curl -fsS --retry 6 --retry-delay 5 -o index.html "${{ vars.HEALTH_URL }}/"
          # Status 200 alone isn't enough: Caddy returns a bare 200 with an
          # EMPTY body for a request whose Host header doesn't match any
          # configured site (e.g. SITE_DOMAIN unset/misconfigured on the
          # server — a real bug that shipped a blank page while every
          # status-code-only check, including earlier versions of this exact
          # smoke test, kept reporting green). Require real content.
          size=$(wc -c < index.html)
          test "$size" -gt 200 || { echo "::error::index.html suspiciously small/empty ($size bytes) — check SITE_DOMAIN / Caddy Host routing"; exit 1; }
          # Fetching / alone still isn't enough — it returns 200 even when the
          # SPA's JS/CSS 404 behind it (a separate bug: a Caddy /static/*
          # misroute once sent the bundle's own JS to Django, which 404'd
          # since it only exists in the mounted build). Pull the real hashed
          # asset path out of index.html, fetch it, and confirm real size.
          asset=$(grep -oE '/static/js/main\.[a-zA-Z0-9]+\.js' index.html | head -1)
          test -n "$asset" || { echo "::error::No SPA JS bundle referenced in index.html"; exit 1; }
          curl -fsS --retry 3 --retry-delay 5 -o main.js "${{ vars.HEALTH_URL }}${asset}"
          jssize=$(wc -c < main.js)
          test "$jssize" -gt 1000 || { echo "::error::SPA JS bundle suspiciously small/empty ($jssize bytes)"; exit 1; }
